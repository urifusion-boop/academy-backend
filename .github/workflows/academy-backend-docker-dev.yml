name: Build and Deploy Academy Backend to Azure VM (DEV)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        run: |
          npm ci
          npm run build --if-present

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build --no-cache -t uriteam/urisvc:academybackenddev-${{ github.sha }} -t uriteam/urisvc:academybackenddev .
          docker push uriteam/urisvc:academybackenddev-${{ github.sha }}
          docker push uriteam/urisvc:academybackenddev

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.dev.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_IP_DEV }}
          username: uridev
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          source: "./docker-compose.dev.yml"
          target: "~/academy-backend/"
          strip_components: 0

      - name: SSH into VM and Deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_IP_DEV }}
          username: uridev
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          script: |
            if [ ! -d ~/academy-backend ]; then
              mkdir -p ~/academy-backend;
            fi
            cd ~/academy-backend
            echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
            docker-compose -f docker-compose.dev.yml down

            # Remove old image to force pull of new one
            docker rmi uriteam/urisvc:academybackenddev || true

            docker-compose -f docker-compose.dev.yml pull
            docker-compose -f docker-compose.dev.yml up -d

            # Cleanup redundant images
            docker image prune -f
